Title: Inhibition of Eumycetoma from MycetOS
Description: Scores compounds for activity against Madurella mycetomatis, the 
  fungus behind most cases of eumycetoma, a neglected infection for which 
  itraconazole is the only treatment and a quarter of patients relapse. Ersilia 
  trained a LazyQSAR classifier on open growth-inhibition data from MycetOS, 
  which screened Medicines for Malaria Venture boxes and other libraries (7,616 
  compounds, 445 actives). Five-fold out-of-fold validation gives AUROC 0.92. 
  Outputs are ranks against 50,000 drug-like molecules, best used to prioritise 
  compounds for screening.
